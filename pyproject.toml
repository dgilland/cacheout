[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cacheout"
dynamic = ["version"]
authors = [{name = "Derrick Gilland", email = "dgilland@gmail.com"}]
description = "A caching library for Python"
readme = "README.rst"
license = "MIT"
keywords = ["cacheout cache caching memoize memoization fifo lifo lfu lru mru"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/dgilland/cacheout"
Documentation = "https://cacheout.readthedocs.org"
Repository = "https://github.com/dgilland/cacheout"
Issues = "https://github.com/dgilland/cacheout/issues"
Changelog = "https://github.com/dgilland/cacheout/blob/master/CHANGELOG.rst"

[project.optional-dependencies]
dev = [
    "black",
    "build",
    "coverage",
    "furo",
    "invoke",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "sphinx",
    "sphinx-autodoc-typehints",
    "tox",
    "twine",
    "wheel",
]

[tool.setuptools.dynamic]
version = {attr = "cacheout.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.distutils.bdist_wheel]
universal = true

[tool.ruff]
src = ["src"]
extend-exclude = [".cache"]
line-length = 100
# target the lowest supported version to avoid introducing unsupported syntax
target-version = "py310"

[tool.ruff.lint]
select = [
    # flake8
    "F",
    "E",
    "W",
    # flake8-bugbear
    "B",
    # pylint
    "PL",
    # isort
    "I",
]
# F811 - redefinition of unused `name` from line `N`
# E203 - whitespace before ':'
# E701 - multiple statements on one line (colon)
# PLR2004 - Magic value used in comparison, consider replacing `...` with a constant variable
# PLW2901 - `...` loop variable `...` overwritten by assignment target
# PLR0913 - Too many arguments in function definition
# PLR0912 - Too many branches
ignore = ["F811", "E203", "E701", "PLR2004", "PLW2901", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
lines-after-imports = 2
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
mypy_path = ["src"]
python_version = "3.10"
exclude = []
show_column_numbers = true
show_error_context = false
ignore_missing_imports = true
warn_return_any = false
strict_optional = true
warn_no_return = true
warn_redundant_casts = false
warn_unused_ignores = false

[tool.pytest.ini_options]
addopts = [
    "--verbose",
    "--doctest-modules",
    "--no-cov-on-fail",
    "--cov-fail-under=100",
    "--cov-report=term-missing",
    "--cov-report=xml:build/coverage/coverage.xml",
    "--cov-report=html:build/coverage",
    "--junitxml=build/testresults/junit.xml",
]

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/_compat.py",
    "*/types.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@t.overload"
]
